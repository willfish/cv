<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.description | escape }}">
  <title>{{ page.title | escape }} | CV</title>
  <link href="media/{{ site.style }}-screen.css" rel="stylesheet">
  <link href="media/{{ site.style }}-print.css" rel="stylesheet" media="print">
  <link rel="icon" type="image/png" href="{{ '/favicon-96x96.png' | relative_url }}" sizes="96x96">
  <link rel="icon" type="image/svg+xml" href="{{ '/favicon.svg' | relative_url }}">
  <link rel="shortcut icon" href="{{ '/favicon.ico' | relative_url }}">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ '/apple-touch-icon.png' | relative_url }}">
  <link rel="manifest" href="{{ '/site.webmanifest' | relative_url }}">
</head>
<body>
  <div class="toolbar">
    <span>Curriculum vitae</span>
    <button id="print-button" type="button" onclick="window.print()">Print / save PDF</button>
  </div>
  <main id="main">
    <article id="content" aria-label="William Fish's curriculum vitae">
    {{ content }}
    </article>
  </main>
</body>
</html>
